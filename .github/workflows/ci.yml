name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api-gateway
            directory: api-gateway-service
          - name: image-processing
            directory: image-processing-service
    name: Unit tests — ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ${{ matrix.directory }}

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        working-directory: ${{ matrix.directory }}
        env:
          PYTHONPATH: .

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

  integration-tests:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for gateway
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v1/health/liveness; then
              echo "Gateway is up"
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run integration tests
        env:
          RUN_INTEGRATION: "1"
          GATEWAY_URL: http://localhost:8080
        run: |
          pip install -r integration-tests/requirements.txt
          pytest integration-tests/ -m integration -v --tb=short

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
